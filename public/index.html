<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Motel Me Leve | Caixa e Comandas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#000;--sf:#141414;--sf2:#1e1e1e;--ln:#2c2c2c;--tx:#fff;--mu:#9a9a9a;--rd:#d81e27;--gn:#2fb463;--yl:#e8b923;--gy:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Barlow,system-ui,sans-serif;color-scheme:dark}
button,input,select{font:inherit;color:inherit}
button{background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.red{background:var(--rd);border-color:var(--rd);font-weight:600}
.big{width:100%;min-height:56px;font-size:1.15rem;font-weight:600;margin-top:10px}
input,select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px;min-height:44px;width:100%}
input[type=checkbox]{width:24px;min-height:24px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:#000;z-index:5}
header img{height:56px}
nav{display:flex;gap:4px;flex:1}nav button{background:none;border-color:transparent;border-radius:0}nav .on{border-bottom:3px solid var(--rd)}
.who{margin-left:auto;color:var(--mu);font-size:.9rem}
main{padding:14px;max-width:1200px;margin:auto;padding-bottom:110px}
.login{max-width:340px;margin:6vh auto;padding:0 20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login img{width:100%;max-width:300px;margin:auto}.login h1{font:600 1.15rem 'Barlow Condensed',sans-serif;color:var(--mu);margin:0 0 6px;letter-spacing:.06em}
#err{color:var(--rd);min-height:1.2em;margin:0}
.sum{display:flex;gap:18px;margin-bottom:14px;font-weight:600;flex-wrap:wrap}.gn{color:var(--gn)}.rd{color:var(--rd)}.yl{color:var(--yl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.suite{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;border:2px solid var(--ln);background:var(--sf)}
.suite h2{font:700 1.7rem 'Barlow Condensed',sans-serif;margin:0}.suite p{margin:0;color:var(--mu);font-size:.9rem}
.tag{font-weight:600}.tag::before{content:"\25CF  "}
.livre{border-color:var(--gn)}.livre .tag{color:var(--gn)}
.ocupada{border-color:var(--rd);background:#1c0709}.ocupada .tag{color:var(--rd)}.ocupada strong{font:700 1.6rem 'Barlow Condensed',sans-serif}
.limpeza{border-color:var(--yl)}.limpeza .tag{color:var(--yl)}
.manut{border-color:var(--gy)}.manut .tag{color:var(--mu)}
.cmdh{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.cmdh h2{margin:0;font:700 2rem 'Barlow Condensed',sans-serif}.cmdh span{color:var(--mu)}
h3{font:600 1.15rem 'Barlow Condensed',sans-serif;color:var(--rd);margin:18px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.host{color:var(--mu)}.prod small{display:block;color:var(--mu)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:56px;height:56px;font-size:1.6rem;padding:0}.qty b{min-width:28px;text-align:center;font-size:1.3rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:center}
.bar .big{margin:0;width:auto;flex:1;max-width:320px}.bar strong{display:block;font:700 1.8rem 'Barlow Condensed',sans-serif}.bar small{color:var(--mu)}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.md{background:var(--sf);border:1px solid var(--ln);border-radius:16px 16px 0 0;width:100%;max-width:440px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));position:relative;max-height:92%;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:16px}}
.md h2{margin:0 0 8px;font:700 1.8rem 'Barlow Condensed',sans-serif}.x{position:absolute;right:10px;top:10px;border:0;background:none;font-size:1.6rem}
.mu{color:var(--mu);margin:4px 0}.big-n{font:700 3rem 'Barlow Condensed',sans-serif;margin:0}
.sumy p{display:flex;justify-content:space-between;margin:4px 0}.sumy span{color:var(--mu)}
.tot{font:700 3rem/1 'Barlow Condensed',sans-serif;color:var(--rd);margin:12px 0}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pays .big{margin:0;font-size:1rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{width:auto;flex:1;min-width:140px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500}td input,td select{min-width:90px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px}.stats small{color:var(--mu);display:block}.stats b{font:700 1.7rem 'Barlow Condensed',sans-serif}.stats .hi{border-color:var(--rd)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs .on{background:var(--rd);border-color:var(--rd)}
.add{display:flex;gap:8px;margin:12px 0}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin:10px 0}.tg label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu)}.tg input{min-height:40px;padding:6px 8px}.tabc{border-top:1px solid var(--ln);padding-top:14px;margin-top:14px}.add button{flex:none}.suite{position:relative}.suite.vip{box-shadow:inset 0 0 0 1px #fff,0 0 18px #ffffff2e}.vb{position:absolute;top:8px;right:8px;background:#fff;color:#000;font:700 .78rem 'Barlow Condensed',sans-serif;letter-spacing:.1em;padding:2px 9px;border-radius:99px}.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.two.one{grid-template-columns:1fr}.two .grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}.col h3{margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--ln);color:var(--tx)}.col h3 small{color:var(--mu);font-weight:500}@media(max-width:700px){.two{grid-template-columns:1fr}}</style></head><body><div id="app"></div>

function seed(){return{uid:10,tol:10,users:[{id:1,name:'Administrador',login:'admin',pass:'admin123',role:'admin',on:1},{id:2,name:'Caixa',login:'caixa',pass:'caixa123',role:'func',on:1}],

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load()||seed();
const isA=()=>me&&me.role=='admin',open=n=>S.stays.find(s=>s.suite==n&&!s.end);

function render(){const y=scrollY,a=$('#app');if(!me){a.innerHTML=loginH();return}

const loginH=()=>`<form class="login" onsubmit="return login(this)"><img src="${LOGO}" alt="Motel Me Leve"><h1>Sistema de Caixa e Comandas</h1><input name="u" placeholder="Usuário" autocomplete="username" required><input name="p" type="password" placeholder="Senha" autocomplete="current-password" required><p id="err"></p><button class="big red">Entrar</button></form>`;
function login(f){const u=S.users.find(x=>x.login==f.u.value.trim()&&x.pass==f.p.value);if(!u||!u.on){$('#err').textContent=u?'Usuário bloqueado. Fale com o administrador.':'Usuário ou senha incorretos.';return false}me=u;view='suites';render();return false}
const go=k=>{view=k;cur=null;render()},out=()=>{fetch("/api/logout",{method:"POST"});me=null;cur=null;render()};
const head=()=>`<header><img src="${LOGO}" alt="Motel Me Leve"><nav>${[['suites','Suítes'],['hist','Histórico'],['caixa','Caixa']].concat(isA()?[['admin','Admin']]:[]).map(([k,l])=>`<button class="${view==k&&!cur?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</nav><span class="who">${esc(me.name)} <button onclick="out()">Sair</button></span></header>`;
function suitesH(){const c={livre:0,ocupada:0,limpeza:0};S.suites.forEach(x=>c[x.st]!=null&&c[x.st]++);
return `<div class="sum"><span class="gn">${c.livre} livres</span><span class="rd">${c.ocupada} ocupadas</span><span class="yl">${c.limpeza} em limpeza</span></div><div class="grid">${S.suites.map(x=>{const s=open(x.n),k=s&&calc(s);return `<button class="suite ${x.st}" onclick="tapSuite('${x.n}')"><h2>Suíte ${x.n}</h2><span class="tag">${ST[x.st]}</span>${s?`<p>Entrada ${hm(s.start)}</p><strong>${R(k.total)}</strong>`:''}</button>`}).join('')}</div>`}
function tapSuite(n){const x=S.suites.find(y=>y.n==n);
if(x.st=='ocupada'){cur=open(n).id;render()}
else if(x.st=='livre')modal(`<h2>Suíte ${n}</h2><p class="mu">Valor</p><p class="big-n">${R(x.base)}</p><p class="mu">Tempo incluído: ${x.hours} horas</p><button class="big red" onclick="start('${n}')">Iniciar estadia</button>`);
else modal(`<h2>Suíte ${n}</h2><p class="mu">${x.st=='limpeza'?'Em limpeza.':'Em manutenção.'}</p>`+(x.st=='limpeza'||isA()?`<button class="big" onclick="setSt('${n}','livre')">Liberar suíte</button>`:'<p>Somente o administrador libera esta suíte.</p>'))}

function comandaH(){const s=S.stays.find(x=>x.id==cur),k=calc(s);
return `<div class="cmdh"><button onclick="cur=null;render()">Voltar</button><h2>Suíte ${s.suite}</h2><span>Entrada ${hm(s.start)}, permanência ${dur(k.m)}</span></div>
<div class="row host"><span>Hospedagem (${s.hours}h incluídas)</span><b>${R(s.base)}</b></div>${k.add?`<div class="row host"><span>Tempo excedente</span><b>${R(k.add)}</b></div>`:''}
${S.cats.map(c=>{const ps=S.prods.filter(p=>p.cat==c&&p.on);return ps.length?`<h3>${esc(c)}</h3>`+ps.map(p=>{const q=(s.items[p.id]||{}).q||0;return `<div class="row prod"><span>${esc(p.name)}<small>${R(p.price)}</small></span><div class="qty"><button onclick="qty(${p.id},-1)" aria-label="Remover ${esc(p.name)}" ${q?'':'disabled'}>−</button><b>${q}</b><button class="red" onclick="qty(${p.id},1)" aria-label="Adicionar ${esc(p.name)}">+</button></div></div>`}).join(''):''}).join('')}
<div class="bar"><div><small>Consumo ${R(k.cons)}</small><strong>${R(k.total)}</strong></div><button class="big red" onclick="fin()">Finalizar estadia</button></div>`}
function qty(id,d){const s=S.stays.find(x=>x.id==cur),p=S.prods.find(x=>x.id==id),i=s.items[id]||(s.items[id]={q:0,p:p.price,n:p.name});i.q=Math.max(0,i.q+d);if(!i.q)delete s.items[id];save();render()}

const sel=(t,i,k,v,o)=>`<select onchange="ed('${t}',${i},'${k}',this.value)">${o.map(([a,b])=>opt(a,b,a==v)).join('')}</select>`;
const chk=(t,i,v)=>`<input type="checkbox" ${v?'checked':''} onchange="ed('${t}',${i},'on',this.checked?1:0)">`;
const aSuites=()=>`<div class="tw"><table><tr><th>Suíte<th>Valor inicial<th>Horas incluídas<th>Cobrança<th>VIP<th>Status</tr>${S.suites.map((x,i)=>`<tr><td>${x.n}${x.rule=='tabela'?'<td>-<td>-':`<td>${I('suites',i,'base',x.base,1)}<td>${I('suites',i,'hours',x.hours,1)}`}<td>${cobSel(i,x)}<td><input type="checkbox" aria-label="Suíte VIP" ${x.vip?'checked':''} onchange="ed('suites',${i},'vip',this.checked?1:0)"><td>${x.st=='ocupada'?'Ocupada':sel('suites',i,'st',x.st,[['livre','Livre'],['limpeza','Limpeza'],['manut','Manutenção']])}</tr>`).join('')}</table></div><button class="big" onclick="addSuite()">Nova suíte</button>`;
const aProds=()=>`<div class="tw"><table><tr><th>Produto<th>Categoria<th>Preço<th>Ativo</tr>${S.prods.map((p,i)=>`<tr><td>${I('prods',i,'name',p.name)}<td>${sel('prods',i,'cat',p.cat,S.cats.map(c=>[c,c]))}<td>${I('prods',i,'price',p.price,1)}<td>${chk('prods',i,p.on)}</tr>`).join('')}</table></div><button class="big" onclick="addProd()">Novo produto</button>`;
const aCats=()=>`<div class="row"><span>${S.cats.map(esc).join(', ')}</span></div><div class="add"><input id="nc" placeholder="Nova categoria"><button class="red" onclick="addCat()">Adicionar</button></div>`;
const aUsers=()=>`<div class="tw"><table><tr><th>Nome<th>Usuário<th>Senha<th>Perfil<th>Ativo</tr>${S.users.map((u,i)=>`<tr><td>${I('users',i,'name',u.name)}<td>${I('users',i,'login',u.login)}<td>${I('users',i,'pass',u.pass)}<td>${sel('users',i,'role',u.role,[['func','Funcionário'],['admin','Administrador']])}<td>${chk('users',i,u.on)}</tr>`).join('')}</table></div><button class="big" onclick="addUser()">Novo funcionário</button>`;
const adminH=()=>`<div class="tabs">${[['suites','Suítes'],['prods','Produtos'],['cats','Categorias'],['users','Funcionários'],['tabs','Tabelas de preço']].map(([k,l])=>`<button class="${adm==k?'on':''}" onclick="adm='${k}';render()">${l}</button>`).join('')}</div>`+({suites:aSuites,prods:aProds,cats:aCats,users:aUsers,tabs:aTabs}[adm])();
function addSuite(){if(!isA())return;S.suites.push({n:pad(S.suites.length+1),base:80,hours:2,extra:30,rule:'hora',st:'livre'});save();render()}
function addProd(){if(!isA())return;S.prods.push({id:Math.max(0,...S.prods.map(p=>p.id))+1,name:'Novo produto',cat:S.cats[0],price:0,on:1});save();render()}
function addCat(){const v=$('#nc').value.trim();if(!isA()||!v||S.cats.includes(v))return;S.cats.push(v);save();render()}
function addUser(){if(!isA())return;const id=S.uid++;S.users.push({id,name:'Novo funcionário',login:'func'+id,pass:'1234',role:'func',on:1});save();render()}
function modal(h){closeM();const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md" role="dialog"><button class="x" onclick="closeM()" aria-label="Fechar">×</button>${h}</div>`;m.onclick=e=>{if(e.target==m)closeM()};document.body.appendChild(m)}
const closeM=()=>document.querySelectorAll('.ov').forEach(e=>e.remove());
setInterval(()=>{if(me&&!$('.ov')&&(cur||view=='suites'))render()},30000);
render();
</script><script src="/api-layer.js"></script></body></html>
